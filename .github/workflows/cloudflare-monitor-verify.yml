name: Cloudflare monitor verification

on:
  pull_request:
    paths:
      - 'workers/cloudflare-monitor/**'
      - '.github/workflows/cloudflare-monitor-verify.yml'
  push:
    branches: [main]
    paths:
      - 'workers/cloudflare-monitor/**'
      - '.github/workflows/cloudflare-monitor-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/cloudflare-monitor
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: workers/cloudflare-monitor/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm test:runtime
      - name: Bundle the private binding template without deploying
        env:
          CLOUDFLARE_MONITOR_ALERT_DESTINATION: monitor-alert@example.invalid
          CLOUDFLARE_MONITOR_SENDER: monitor@example.invalid
        run: |
          pnpm run render:private-config
          pnpm exec wrangler deploy --dry-run --config wrangler.private.jsonc
          rm -f wrangler.private.jsonc
