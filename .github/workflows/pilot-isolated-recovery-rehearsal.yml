name: Pilot isolated recovery rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pilot-isolated-recovery-rehearsal
  cancel-in-progress: false

jobs:
  rehearse:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install recovery script dependencies
        run: pnpm install --frozen-lockfile

      - name: Create ephemeral isolated runtime configuration
        run: node scripts/ops/write-recovery-runtime-config.mjs ops/recovery

      - name: Fetch newest owned encrypted backup
        env:
          BACKUP_DRIVE_FOLDER_ID: ${{ secrets.BACKUP_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p recovery
          node scripts/ops/download-google-drive-backup.mjs recovery/backup.tar.gz.gpg

      - name: Decrypt, safely extract, and verify backup
        env:
          BACKUP_GPG_PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_GPG_PASSPHRASE" || { echo 'Missing required recovery passphrase.' >&2; exit 1; }
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_GPG_PASSPHRASE" --output recovery/backup.tar.gz --decrypt recovery/backup.tar.gz.gpg
          tar --list --gzip --file recovery/backup.tar.gz | node -e '
            let input = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const members = input.trim().split("\n").filter(Boolean);
              const valid = members.length > 0 && members.every((member) => member === "backup-workspace/" || (/^backup-workspace\/.+/.test(member) && !member.split("/").includes("..")));
              if (!valid) process.exitCode = 1;
            });
          '
          mkdir recovery/extracted
          tar --extract --gzip --file recovery/backup.tar.gz --directory recovery/extracted --no-same-owner --no-same-permissions
          test -f recovery/extracted/backup-workspace/database/roles.sql
          test -f recovery/extracted/backup-workspace/database/schema.sql
          test -f recovery/extracted/backup-workspace/database/data.sql
          test -f recovery/extracted/backup-workspace/storage/manifest.json
          test -f recovery/extracted/backup-workspace/SHA256SUMS
          node scripts/ops/verify-backup-checksums.mjs recovery/extracted/backup-workspace
          echo 'Encrypted backup decrypted, safely extracted, and checksums verified.'

      - name: Start database-only isolated target
        run: docker compose -f ops/recovery/compose.db-bootstrap.yaml -f ops/recovery/.private.db-bootstrap.compose.yaml up --detach --wait --wait-timeout 120

      - name: Restore database roles schema and data
        run: |
          set -euo pipefail
          run_quiet() {
            if ! "$@" > recovery/restore-command.log 2>&1; then
              rm -f recovery/restore-command.log
              echo 'Isolated database restore failed.' >&2
              exit 1
            fi
          }
          db=(docker compose -f ops/recovery/compose.db-bootstrap.yaml -f ops/recovery/.private.db-bootstrap.compose.yaml exec -T db psql -v ON_ERROR_STOP=1 -U postgres -d postgres)
          run_quiet "${db[@]}" -f /dev/stdin < ops/recovery/prepare-empty-restore-target.sql
          run_quiet "${db[@]}" -f /dev/stdin < recovery/extracted/backup-workspace/database/roles.sql
          run_quiet "${db[@]}" -f /dev/stdin < recovery/extracted/backup-workspace/database/schema.sql
          if ! { printf 'SET session_replication_role = replica;\n'; cat recovery/extracted/backup-workspace/database/data.sql; } | "${db[@]}" -f /dev/stdin > recovery/restore-command.log 2>&1; then
            rm -f recovery/restore-command.log
            echo 'Isolated database restore failed.' >&2
            exit 1
          fi
          # Role restore may replace service login passwords. Reapply recovery-only
          # credentials before Auth, PostgREST, or Storage are allowed to start.
          run_quiet "${db[@]}" -f /docker-entrypoint-initdb.d/init-scripts/99-recovery-roles.sql
          rm -f recovery/restore-command.log
          echo 'Isolated database restore completed.'

      - name: Start full isolated Supabase runtime
        run: docker compose -f ops/recovery/compose.yaml -f ops/recovery/.private.runtime.compose.yaml up --detach --wait --wait-timeout 120

      - name: Restore Storage bytes and emit aggregate recovery evidence
        run: |
          set -euo pipefail
          set -a
          source ops/recovery/.env
          set +a
          RECOVERY_SUPABASE_URL="http://127.0.0.1:58000" RECOVERY_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node scripts/ops/restore-supabase-storage.mjs recovery/extracted/backup-workspace
          db=(docker compose -f ops/recovery/compose.yaml -f ops/recovery/.private.runtime.compose.yaml exec -T db psql -At -v ON_ERROR_STOP=1 -U postgres -d postgres)
          "${db[@]}" -c "select json_build_object('archive_checksums_verified', true, 'migrations', (select count(*) from supabase_migrations.schema_migrations), 'tenants', (select count(*) from public.tenants), 'memberships', (select count(*) from public.tenant_memberships), 'auth_users', (select count(*) from auth.users), 'storage_objects', (select count(*) from storage.objects), 'storage_bytes', (select coalesce(sum(nullif(metadata->>'size','')::bigint), 0) from storage.objects), 'membership_checksum', (select md5(coalesce(string_agg(id::text || ':' || tenant_id::text || ':' || coalesce(user_id::text,'') || ':' || status || ':' || role, ',' order by id), '')) from public.tenant_memberships), 'storage_checksum', (select md5(coalesce(string_agg(bucket_id || ':' || name || ':' || coalesce(metadata->>'size',''), ',' order by bucket_id, name), '')) from storage.objects))::text;" > recovery/aggregate-evidence.json
          node scripts/ops/verify-isolated-recovery-copy-counts.mjs recovery/extracted/backup-workspace/database/data.sql recovery/aggregate-evidence.json
          RECOVERY_SUPABASE_URL="http://127.0.0.1:58000" RECOVERY_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" node scripts/ops/verify-isolated-auth-rls.mjs
          cat recovery/aggregate-evidence.json
          rm -f recovery/aggregate-evidence.json
          unset SERVICE_ROLE_KEY ANON_KEY JWT_SECRET POSTGRES_PASSWORD

      - name: Remove runner-local recovery material
        if: always()
        run: |
          docker compose -f ops/recovery/compose.yaml -f ops/recovery/.private.runtime.compose.yaml down --volumes --remove-orphans > /dev/null 2>&1 || true
          docker compose -f ops/recovery/compose.db-bootstrap.yaml -f ops/recovery/.private.db-bootstrap.compose.yaml down --volumes --remove-orphans > /dev/null 2>&1 || true
          rm -rf recovery
          rm -f ops/recovery/.env ops/recovery/.private.db-bootstrap.compose.yaml ops/recovery/.private.runtime.compose.yaml
