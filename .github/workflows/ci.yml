name: CI

# Phase A verification gates (architecture §19).
# `verify` job — stages 1-5 + 10: install, lockfile guard, service-role containment
#   (source-level), typecheck, lint, unit tests, build, then the Story 2.4
#   AUTHORITATIVE built-bundle service-role containment grep over `.next` (runs
#   AFTER build — order is load-bearing).
# `db` job — stages 6 + 8 (ACTIVATED by Story 2.2): Supabase migration reset from
#   an EMPTY db, then the DB-backed integration + RLS-negative suites against the
#   LOCAL stack only — now including the Story 2.4 H4 RLS table-inventory gate that
#   fails CI when a tenant-owned table is not enrolled. See docs/quality/ci.md for
#   the gate-to-story mapping.
#
# Stop conditions honored: no secrets, no shared dev/staging/prod project, no
# deploy step. The `db` job uses the LOCAL Supabase CLI stack only (its keys are
# the universal local-demo defaults, not real secrets).

on:
  pull_request:
    # Verify the dependent Epic 11 repair PRs before their approved retarget to main.
    branches:
      - main
      - codex/story-11-3-invitation-identity-binding
      - codex/story-11-3-invitation-lifecycle
      - codex/story-11-3-auth-callback
  push:
    branches: [main]

# Least privilege: this verify-only pipeline only needs to read the repo.
permissions:
  contents: read

# Cancel superseded PR runs on the same ref so CI stays small and cheap.
# Only cancel for pull_request events — a push→main run is never cancelled, so
# the post-merge safety-net run always completes for every merged commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Bound the job so a hung step (networked install, or the `next build`
    # Google-font fetch) fails fast instead of running to the 360-minute default.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm BEFORE setup-node: setup-node's `cache: pnpm` needs pnpm on PATH.
      # action-setup reads the version from package.json "packageManager"
      # (pnpm@10.24.0); do NOT also pass `version:` or it errors on conflict.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Python for focused Auto-BMAD contracts
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfiles (single package manager)
        run: pnpm run verify:lockfiles

      # Dependency vulnerability scan (BLOCKING) — closes the standing NFR
      # CONCERN carried Epics 2-5 (owner decision 2026-07-03: blocking gate).
      # Fails the build on HIGH/CRITICAL advisories against the installed tree;
      # moderate/low are reported in the log but do not block. NOTE: findings
      # arrive when the npm advisory DB updates, not when code changes — a red
      # run here on an untouched branch means a new upstream advisory, and the
      # fix is a dependency bump (or a documented, dated exception), never
      # weakening the threshold.
      - name: Audit dependencies (blocking, high severity)
        run: pnpm audit --audit-level=high

      - name: Verify service-role containment (no client-path leakage)
        run: pnpm run verify:service-role-containment

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests (pure logic, node --test)
        run: pnpm run test:unit

      - name: BMAD focused concurrent memlog contracts
        run: pnpm run test:bmad-focused

      - name: Auto-BMAD focused routing and process-API contracts
        run: pnpm run test:auto-bmad-focused

      - name: Build
        run: pnpm build

      # Stage 10 (lightweight containment): the AUTHORITATIVE R-002 built-bundle
      # service-role grep (Story 2.4). MUST run AFTER `pnpm build` — it scans the
      # produced `.next/` payload and FAILS LOUD if `.next` is absent, so the order
      # is load-bearing (architecture §19; never reorder before build). This app
      # uses NO service-role key (anon + RLS), so a clean build yields zero hits.
      - name: Verify built-bundle service-role containment (no leakage in .next)
        run: pnpm run verify:bundle-containment

  # ──────────────────────────────────────────────────────────────────────────
  # Story 2.2 activates architecture §19 stage 6 (migration reset) + stage 8
  # (RLS-negative tests). Runs against the LOCAL Supabase CLI stack ONLY — never
  # a shared dev/staging/prod project. The local stack's keys are the universal
  # local-demo defaults (not real secrets), provided by `tests/support/test-env.ts`.
  # `SUPABASE_TEST_REQUIRED=1` makes a missing stack a HARD failure so this gate
  # can never silently false-green.
  # ──────────────────────────────────────────────────────────────────────────
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Gate the expensive ~20-min Supabase boot behind the fast `verify` job: if a
    # type/lint/unit error would fail `verify`, do NOT waste CI minutes spinning up
    # the local stack (review fix 2026-06-26).
    needs: [verify]
    env:
      SUPABASE_TEST_REQUIRED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin an EXPLICIT CLI version — `latest` lets a Supabase release silently
          # change `db reset` behavior and break the gate non-deterministically
          # (review fix 2026-06-26). Matches the version used to author the stack.
          version: 2.115.0

      # Stage 6: empty DB → migrate → seed. `supabase start` boots the local stack
      # (Docker is available on ubuntu-latest); `db reset` then applies the
      # tenant_foundation migration from empty and runs seed.sql.
      - name: Start local Supabase stack
        run: supabase start

      - name: Migration reset (empty DB → migrate → seed)
        # Bounded retry (added 2026-07-26): `supabase db reset` intermittently fails with
        # "Error status 502: An invalid response was received from the upstream server" during its
        # FINAL "Restarting containers..." step — i.e. AFTER every migration applied and seed.sql ran.
        # After a non-zero exit, the bounded verifier accepts recovery ONLY when the exact repository
        # migration ledger, local seed fixtures, and auth health all prove completion. Otherwise the
        # idempotent reset is retried; a genuinely broken migration still reds the gate.
        run: |
          for attempt in 1 2 3; do
            echo "::group::supabase db reset (attempt $attempt/3)"
            if supabase db reset; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "db reset attempt $attempt failed"
            if node scripts/verify/check-local-supabase-reset.mjs; then
              echo "db reset completed; recovered from the CLI's final restart error"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          echo "supabase db reset failed after 3 attempts — treating as a REAL failure"
          exit 1

      # Stage 8: DB-backed integration + cross-tenant RLS-negative suites.
      - name: Integration + RLS negative tests (local stack)
        run: pnpm run test:int

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Same gate as `db`: only spin up the stack + browser after the fast `verify` job
    # is green. Runs in parallel with `db` (each boots its own local stack).
    needs: [verify]
    env:
      # Auth-mail E2E must fail loudly if its required local Auth/Mailpit stack is
      # unavailable; this matches the database integration gate.
      SUPABASE_TEST_REQUIRED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser (chromium + OS deps)
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Pin the same explicit version as the `db` job (see its note).
          version: 2.115.0

      - name: Start local Supabase stack
        run: supabase start

      - name: Migration reset (empty DB → migrate → seed)
        # Bounded retry (added 2026-07-26): `supabase db reset` intermittently fails with
        # "Error status 502: An invalid response was received from the upstream server" during its
        # FINAL "Restarting containers..." step — i.e. AFTER every migration applied and seed.sql ran.
        # The same exact-ledger + seed + auth verifier used by `db` distinguishes completed recovery
        # from a real migration/seed failure before any retry or Playwright execution.
        run: |
          for attempt in 1 2 3; do
            echo "::group::supabase db reset (attempt $attempt/3)"
            if supabase db reset; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "db reset attempt $attempt failed"
            if node scripts/verify/check-local-supabase-reset.mjs; then
              echo "db reset completed; recovered from the CLI's final restart error"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 15
            fi
          done
          echo "supabase db reset failed after 3 attempts — treating as a REAL failure"
          exit 1

      # The Playwright webServer builds + starts the app against the local stack
      # (NEXT_PUBLIC_* are inlined from playwright.config.ts), globalSetup seeds the
      # two-tenant fixture, and the specs drive the real browser journeys (G-2/G-3).
      - name: E2E tests (Playwright)
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
