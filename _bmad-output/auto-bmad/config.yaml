version: 1
profiles_source_version: "0.31.0"  # abm version whose assets/profiles.yaml seeded the profiles +
                                  # phase_profiles blocks below; re-stamped by the Phase 0 heal (append-only for
                                  # current schemas; closed v0.24 schema migration preserves valid overrides) or `reprovision`.
delegation:                # spawn mechanism — host/mode auto-detected each run
  host: auto               # auto (detect each run) | claude-code | codex | opencode | other
  mode: auto               # auto (derive from host) | subagents | inline
  cli_phases: {}           # OPT-IN per-phase external-CLI routing; empty => every phase uses its tier
tea:
  enabled: true            # TEA phases on (bmad-testarch-* skills present)
  framework_ci: skip       # prompt | done | skip — deferred at first run (no app code yet; revisit /bmad-testarch-framework later)
  gate_max_iterations: 2   # Phase 8 trace-gate remediation cap before only waive/stop are offered
  story_trace_advisory:    # per-story, non-blocking trace pass — shifts coverage-gap visibility left on LONG epics
    enabled: true          # self-activating: dormant on short epics, fires only on long high-risk stories
    min_epic_stories: 6    # only runs in epics with >= this many stories
    skip_last_stories: 3   # also skip the epic's last N stories (their gap surfaces at the epic-end trace gate)
git:
  mode: auto               # auto -> detect; or force "remote" / "local" (detected this run: remote)
  branch_prefix: "story/"
  epic_branch_prefix: "epic/"  # epic mode: the one branch a whole epic run commits to (epic/{e}-{slug})
  base_branch: main        # auto-detected
  offer_merge: true        # Phase 9: ask the user whether to merge a clean-completion PR
  ci_wait_minutes: 30      # max wait for in-progress CI before deciding (used only when offer_merge is on)
code_review:
  followup: recommended     # Phase 7 follow-up review pass at the followup_review profile
  security_layer: true      # write auto-bmad's security review layer into the project's managed review layers
  cross_model_layer: codex  # independent Luna/xhigh leaf reviewer via the external Codex CLI

# --- profiles + phase_profiles: copied verbatim from {skill-root}/assets/profiles.yaml ---
# To retune delegate model/effort: edit the blocks below and run `/auto-bmad reprovision`
# to re-sync the managed review layers. To discard edits and re-seed the shipped
# defaults: `/auto-bmad reset-defaults`.
profiles:
  default:                 # unspecified work, exploration, repository mapping, document scanning
    claude:
      model: sonnet
      effort: medium
    codex:
      model: gpt-5.6-terra
      reasoning_effort: medium
    opencode:
      model: ""
      variant: ""
  light:                   # mechanical / classification / advisory work
    claude:
      model: sonnet
      effort: xhigh         # CLI route / cross-model layer only (in-tool Claude Code effort inherits the session)
    codex:
      model: gpt-5.6-luna
      reasoning_effort: medium
    opencode:
      model: ""            # provider/model; BLANK => inherit (CLI route / cross-model layer only)
      variant: ""          # OPTIONAL, CLI route only: --variant high|max|minimal
  standard:                # the default tier
    claude:
      model: opus
      effort: high
    codex:
      model: gpt-5.6-terra
      reasoning_effort: high
    opencode:
      model: ""
      variant: ""
  critical:                # rare, high-stakes: security, architecture, conflict resolution, convergence
    claude:
      model: fable
      effort: high
    codex:
      model: gpt-5.6-sol
      reasoning_effort: xhigh
    opencode:
      model: ""
      variant: ""
  diverse_review:          # independent leaf reviewer: fast model diversity at full review depth
    claude:
      model: sonnet
      effort: xhigh
    codex:
      model: gpt-5.6-luna
      reasoning_effort: xhigh
    opencode:
      model: ""
      variant: ""

phase_profiles:
  build: standard                   # Phase 3 plan run + Phase 5 build run of bmad-build-auto (the coding step)
  followup_review: standard         # Phase 7 primary/follow-up review + review-fix stays Terra/high
  final_convergence: critical       # explicit conflict resolution / legacy adoption / final convergence only
  security_layer: critical          # high-stakes security lens: Sol/xhigh on Codex; baked into auto-bmad-security (gated by code_review.security_layer)
  cross_model_layer: diverse_review # independent read-only leaf reviewer: Luna/xhigh on Codex; external CLI tool is code_review.cross_model_layer
  tea_triage: light                 # Phase 0 story-risk classification (cheap)
  tea_per_story: standard           # Phase 4 ATDD, Phase 6 automate, Phase 7 tail trace advisory
  tea_epic: critical                # Phase 2 epic test design, Phase 8 blocking trace gate (+ its remediation)
  tea_epic_audit: standard          # Phase 8 advisory gates (nfr + test-review) — one tier below the blocking trace gate
  retrospective: default            # Phase 8 headless retrospective (-H {e}); read-heavy synthesis
  deferred_reconcile: standard      # Phase 8 (epic-end, pre-archive): verify-against-code which unmarked/partial deferred items are now fully resolved and mark them
build:
  spec_approval: false      # opt-in per-story human approval of the spec between Phase 3 (plan) and Phase 5 (build);
