  - "[7-1] Change Accepterat pris to differ from sent total -> amber 'Prisjustering' panel + required 'Motivering för prisjustering' field appear; confirm DISABLED while reason empty; typed reason enables confirm and submit succeeds"
  - "[7-1] Enter free text in 'Bevisreferens (extern)' with no file id, confirm -> succeeds; reference stored, no file link created"
  - "[7-1] Paste the id of an already-uploaded own-tenant file into 'Bevisfil (id)', confirm -> succeeds (acceptance_evidence link created)"
