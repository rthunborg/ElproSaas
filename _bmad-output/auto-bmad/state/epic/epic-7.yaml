  - "[7-2] DB inspection: exactly one quote_acceptances row, version status=accepted, one jobs row (matching source refs, status=created, carried customer/facility/contact), one quote_events accepted, one job_events created, one audit_events row with targetId-only metadata"
  - "[7-2] Reload the accepted version page -> stable accepted text, no form, no error (idempotent landing)"
  - "[7-2] Re-run the exact same accept once more -> still exactly ONE acceptance/job/event row each and NO new audit_events row (no duplicate audit on retry)"
