  - "[7-1] Select a DRAFT version of the same quote -> 'Acceptans' section shows 'Acceptans kan registreras när versionen är skickad.' and NO form"
  - "[7-1] In the sent form -> 'Accepterat pris (kr)' pre-filled with the frozen sent total and 'Skickat totalbelopp: <X> kr' shown beneath; values match"
