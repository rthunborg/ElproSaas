services:
  db:
    image: supabase/postgres:17.6.1.136
    env_file: .env
    environment:
      POSTGRES_DB: postgres
      JWT_EXP: 3600
    command: ["postgres", "-c", "log_min_messages=fatal"]
    volumes:
      - recovery-db-data:/var/lib/postgresql/data
      - ./bootstrap-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-recovery-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  recovery-db-data: