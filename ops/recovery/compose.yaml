services:
  db:
    image: supabase/postgres:17.6.1.136
    env_file: .env
    environment:
      POSTGRES_DB: postgres
      JWT_EXP: 3600
    command: ["postgres", "-D", "/etc/postgresql", "-c", "log_min_messages=fatal", "-c", "cron.launch_active_jobs=off", "-c", "pg_net.batch_size=0"]
    volumes:
      - recovery-db-data:/var/lib/postgresql/data
      - ./bootstrap-roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-recovery-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.196.0
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"

  rest:
    image: postgrest/postgrest:v14.17
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_SCHEMAS: public,auth,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  storage:
    image: supabase/storage-api:v1.74.0
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      POSTGREST_URL: http://rest:3000
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TUS_USE_FILE_VERSION_SEPARATOR: "true"
      TENANT_ID: stub
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - recovery-storage-data:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    image: kong/kong:3.9.3
    depends_on:
      auth:
        condition: service_started
      rest:
        condition: service_started
      storage:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 127.0.0.1:8001
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  recovery-db-data:
  recovery-storage-data:

networks:
  default:
    internal: true
